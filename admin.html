<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff appointments | Dental Care Clinic</title><link rel="stylesheet" href="/css/style.css"><style>
.admin-main{min-height:70vh;padding:60px 0;background:#f4fafc}.admin-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.admin-login{display:flex;gap:10px;max-width:520px}.admin-login input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px}.admin-table-wrap{overflow:auto;margin-top:22px}table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:850px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--navy);background:#f4fafc}td select{border:1px solid var(--line);padding:7px;border-radius:7px}.admin-message{color:var(--muted);font-size:.9rem}.admin-error{color:#bf2844}.admin-count{color:var(--blue);font-weight:800}
</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/"><span class="brand-icon">✚</span><span><strong>Dental Care</strong><small>CLINIC · STAFF</small></span></a><a class="text-link" href="/">← Back to website</a></div></header>
<main class="admin-main"><div class="container"><div class="admin-head"><div><div class="eyebrow">PRIVATE STAFF AREA</div><h1 style="font-size:2.4rem">Appointment requests</h1><p class="admin-message">Use your staff API key to view requests and update their status.</p></div><div class="admin-count" id="count"></div></div>
<section class="admin-card"><form id="loginForm" class="admin-login"><input type="password" id="apiKey" autocomplete="current-password" placeholder="Staff API key" required><button class="btn btn-primary" type="submit">Load requests</button></form><p id="message" class="admin-message" role="status">Enter the API key configured in your Netlify environment variables.</p><div id="tableWrap" class="admin-table-wrap" hidden></div></section></div></main><script src="/js/admin.js" defer></script></body></html>
